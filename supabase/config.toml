project_id = "auto-estilo-barbershop"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "5MiB"
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
[auth.email.template.magic_link]
subject = "Seu código de acesso — Auto-estilo"
content_path = "./supabase/templates/magic-link.html"
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
